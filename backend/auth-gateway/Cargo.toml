[package]
name = "auth-gateway"
version = "0.1.3"
edition = "2024"
default-run = "auth-gateway"
license-file = "../../LICENSE"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
publish = false

[dependencies]
async-trait = { workspace = true }
auth-core = { path = "../auth-core" }
anyhow = { workspace = true, features = ["backtrace"] }
axum = { workspace = true, features = ["macros"] }
axum-reverse-proxy = { workspace = true, features = ["full"] }
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
hyper = "1.8.1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tower-sessions = "0.14.0"
tower-http = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
openidconnect.workspace = true
axum-extra = { version = "0.12.6", features = ["typed-header"] }

[dev-dependencies]
axum-test = { workspace = true }
mockito = { workspace = true }
testcontainers = { workspace = true }
url = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-postgres", "sqlx-sqlite"] }
migration = { version = "0.1.0", path = "../auth-core/migration" }
