version: "3.10"

services:
  sessionspaces-controller:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../../..:/workspace:cached,z
    command: sleep infinity
    environment:
      DATABASE_URL: mysql://root:rootpassword@ispyb/ispyb_build
      LDAP_URL: ldap://ldapmaster.diamond.ac.uk
      SESSIONSPACES_API_BIND: 0.0.0.0:8081

  ispyb:
    image: ghcr.io/diamondlightsource/ispyb-database:v4.9.0
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
