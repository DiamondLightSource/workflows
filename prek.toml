default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files" },
  { id = "check-json", exclude = "(\\.devcontainer/|tsconfig\\.(app|node)\\.json$|grafana-dashboards/)" },
  { id = "check-toml" },
  { id = "check-yaml", args = ["--allow-multiple-documents"], exclude = "(^|/)templates/|\\.tpl\\.ya?ml$" },
]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.26.0"
hooks = [
  {
    id = "commitlint",
    stages = ["commit-msg"],
    pass_filenames = true,
    additional_dependencies = ["@commitlint/config-conventional"],
  },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "prettier",
    name = "prettier (workspace root)",
    language = "system",
    entry = "npx --yes prettier@3.6.2 --write",
    files = "^[^/]+\\.(ya?ml)$",
    pass_filenames = true,
  },
]
