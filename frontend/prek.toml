[[repos]]
repo = "local"
hooks = [
  {
    id = "prettier",
    name = "prettier",
    language = "node",
    entry = "prettier --config .prettierrc --ignore-path ../.gitignore --check \"**/*.{js,ts,tsx,json}\"",
    files = "\\.(js|ts|tsx|json)$",
    pass_filenames = false,
    additional_dependencies = ["prettier@3.9.8"],
  },
]
