packages:
  - apollo-workflows-lib
  - workflows-lib
  - workflows-lib-2
  - workflows-lib-shared
  - relay-workflows-lib
  - dashboard
  - dashboard-2

# Compatibility with release-please
# resolves local dependencies with explicit version specifiers
linkWorkspacePackages: true

# Reproduces package layout from yarn
# TODO: remove when undeclared dependencies are resolved
shamefullyHoist: true

overrides:
  react-is: ^18.3.1
  "@types/react": ^18.3.12

allowBuilds:
  esbuild: true
  msw: true

minimumReleaseAge: 10080 # 1 week
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  - semver@6.3.2 # TODO: neccessary due to newly introduced minimumReleaseAge, can be removed in future update
