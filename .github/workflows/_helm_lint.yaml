name: Helm Charts

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Chart Testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Install chart dependencies
        run: |
          helm repo add vcluster https://charts.loft.sh
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add grafana https://grafana-community.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
          helm repo add opentelemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add localstack https://localstack.github.io/helm-charts
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo add k6-operator https://grafana.github.io/helm-charts

      - name: Lint
        run: >
          ct
          lint
          --target-branch=${{ github.event.repository.default_branch }}
          --validate-maintainers=false
          --check-version-increment=false
          --lint-conf=.lintconf.yaml
