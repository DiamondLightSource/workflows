name: Compose Secrets Hook

on:
  workflow_call:

jobs:
  test_compose_secrets_hook:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        working-directory: charts/workflows/tests
        run: uv sync --all-extras --dev

      - name: Run Ruff format check
        working-directory: charts/workflows/tests
        run: uv run ruff format --check . ../hooks/compose-secrets.py

      - name: Run Ruff lint
        working-directory: charts/workflows/tests
        run: uv run ruff check . ../hooks/compose-secrets.py

      - name: Run pytest
        working-directory: charts/workflows/tests
        run: uv run pytest
