name: Prek Formatting Checks

on:
  workflow_call:

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.x"

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: rustfmt

      - name: Run prek hooks
        uses: j178/prek-action@v2.0.6
        with:
          prek-version: "0.4.12"
