name: Workflows CLI Code

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          components: clippy,rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./workflows-cli/target
          key: cli-lint

      - name: Check Formatting
        working-directory: workflows-cli
        run: >
          cargo fmt
          --package workflows
          --check

      - name: Lint with Clippy
        working-directory: workflows-cli
        run: >
          cargo clippy
          --all-targets
          --all-features
          --no-deps

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./workflows-cli/target
          key: cli-test

      - name: Run test
        working-directory: workflows-cli
        run: WORKFLOWS_CLI_TEST_ENABLE_MOCK_COMMAND=1 cargo test

  coverage:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      - name: Download tarpaulin
        run: |
          curl -L https://github.com/xd009642/tarpaulin/releases/latest/download/cargo-tarpaulin-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x cargo-tarpaulin
          mv cargo-tarpaulin ~/.cargo/bin/

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run coverage
        run: |
          cd workflows-cli
          WORKFLOWS_CLI_TEST_ENABLE_MOCK_COMMAND=1 cargo tarpaulin --out html

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage.html
          path: workflows-cli/tarpaulin-report.html

  release:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./workflows-cli/target
          key: cli-release

      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: x86_64-unknown-linux-musl

      - name: Build binary
        run: |
          cd workflows-cli
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Zip binary
        run: zip workflows-cli ./workflows-cli/target/x86_64-unknown-linux-musl/release/workflows -j

      - name: Release CLI
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/workflows-cli@'))
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: workflows-cli.zip
