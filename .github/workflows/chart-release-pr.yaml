name: Chart Release

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview only; create local tags, commit and push nothing
        type: boolean
        default: true

concurrency:
  group: chart-release-pr
  cancel-in-progress: false

jobs:
  release:
    # Skip the push produced by a release PR merge (chart-release-tag.yaml handles it).
    if: "${{ !contains(github.event.head_commit.message, 'chore(charts): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: 1077859
          private-key: ${{ secrets.RELEASE_PLEASE_CLIENT_SECRET }}

      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Install git-cliff
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: git-cliff@2.12.0

      - name: Reset release branch to main
        run: git checkout -B chart-release origin/main

      - name: Prepare chart release
        id: prepare
        env:
          DRY_RUN: ${{ inputs.dry-run && 'true' || '' }}
        run: |
          output="$(bash .github/scripts/chart-release.sh)"
          echo "$output"
          echo "status=$(echo "$output" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Push initial tag
        if: ${{ !inputs.dry-run && startsWith(steps.prepare.outputs.status, 'INITIAL') }}
        env:
          status: ${{ steps.prepare.outputs.status }}
        run: |
          tag="${status#INITIAL }"
          git push origin "$tag"

      - name: Commit, push and open release PR
        if: ${{ !inputs.dry-run && startsWith(steps.prepare.outputs.status, 'RELEASE') }}
        env:
          status: ${{ steps.prepare.outputs.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          message="chore(charts): release charts"
          body="Release ${status#RELEASE }"
          git config user.name "chart-release[bot]"
          git config user.email "chart-release[bot]@users.noreply.github.com"
          git add -u charts
          git commit -m "$message" -m "$body"
          git push --force origin HEAD:chart-release
          pr_number="$(gh pr list --head chart-release --json number --jq '.[0].number' 2>/dev/null)"
          if [ -n "${pr_number}" ]; then
            gh pr edit "${pr_number}" --title "$message" --body "$body"
          else
            gh pr create --base main --head chart-release --title "$message" --body "$body"
          fi
