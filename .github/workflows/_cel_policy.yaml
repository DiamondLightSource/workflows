name: CEL ValidatingAdmissionPolicy

on:
  workflow_call:

jobs:
  test-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Setup Chainsaw
        uses: kyverno/action-install-chainsaw@1223ef75bedeb59c4e7b5455463d4316e76dff01 # v0.2.15

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config_file: .github/kind-config-mutating-policy.yaml
          # Kubernetes >= 1.34 is required for the MutatingAdmissionPolicy feature gate.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0

      - name: Install chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
          helm repo add localstack https://localstack.github.io/helm-charts
          helm repo update
          helm dep build charts/workflows
          helm dep build charts/sessionspaces
          helm dep build charts/sessionspaces/charts/database
          helm dep build charts/identity-mapper
          helm dep build charts/events

      - name: Install Workflows CRDs
        run: |
          kubectl apply -k "https://github.com/argoproj/argo-workflows/manifests/base/crds/minimal?ref=v4.1.5"
          kubectl apply -f charts/identity-mapper/crds/useridentity.yaml
          kubectl apply -R -f charts/events/crds

      - name: Install Kueue CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/kueue/v0.19.0/config/components/crd/bases/kueue.x-k8s.io_clusterqueues.yaml
          kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/kueue/v0.19.0/config/components/crd/bases/kueue.x-k8s.io_localqueues.yaml

      - name: Install mpi-operator CRDs
        run: |
          curl -sL https://raw.githubusercontent.com/kubeflow/mpi-operator/v0.7.0/deploy/v2beta1/mpi-operator.yaml | yq e 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side -f -

      - name: Run Chainsaw Tests
        run: |
          chainsaw test --test-dir charts/workflows/test-policy/cel-artifact-s3,charts/workflows/test-policy/cel-queue-name,charts/workflows/test-policy/cel-workloadpriority,charts/workflows/test-policy/cel-mutate-queue-name,charts/workflows/test-policy/cel-mutate-workloadpriority,charts/workflows/test-policy/cel-mutate-pod-gc,charts/workflows/test-policy/cel-mutate-posix-uid,charts/workflows/test-policy/cel-mutate-pod-resources,charts/workflows/test-policy/cel-mutate-envoy-sidecar
