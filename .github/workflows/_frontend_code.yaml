name: Frontend Code

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.16.1
          runtime: node@22

      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Download Graph Proxy Schema Artifact
        uses: actions/download-artifact@v6.0.0
        with:
          name: graph-proxy
          path: frontend/relay-workflows-lib

      - name: Compile Relay
        working-directory: frontend/relay-workflows-lib
        run: pnpm relay

      - name: Build Typescript
        working-directory: frontend/
        run: pnpm tsc

      - name: Lint TypeScript Code
        working-directory: frontend
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.16.1
          runtime: node@22

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Download Graph Proxy Schema Artifact
        uses: actions/download-artifact@v6.0.0
        with:
          name: graph-proxy
          path: frontend/relay-workflows-lib

      - name: Compile Relay
        working-directory: frontend/relay-workflows-lib
        run: pnpm relay

      - name: Test
        working-directory: frontend
        run: pnpm test
