name: Graph Proxy Code

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ARGO_SERVER_SCHEMA_URL: https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/v4.1.5/api/jsonschema/schema.json
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          components: clippy,rustfmt

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: backend/graph-proxy
          workspaces: backend

      - name: Create argo workflows openapi types file
        run: |
          printf "\n" > backend/argo-workflows-openapi/src/types.rs

      - name: Check Formatting
        working-directory: backend/graph-proxy
        run: >
          cargo fmt
          --all
          --check

      - name: Lint with Clippy
        working-directory: backend/graph-proxy
        run: >
          cargo clippy
          --all-targets
          --all-features
          --no-deps
          --
          --deny warnings

      - name: Check Dependencies with Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans
          manifest-path: backend/Cargo.toml

  test:
    runs-on: ubuntu-latest
    env:
      ARGO_SERVER_SCHEMA_URL: https://raw.githubusercontent.com/argoproj/argo-workflows/refs/tags/v4.1.5/api/jsonschema/schema.json
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
          components: rustfmt

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: backend/graph-proxy
          workspaces: backend

      - name: Run Tests
        working-directory: backend/graph-proxy
        # Submission tests build very large debug futures; the default test-thread
        # stack overflows. 16 MiB leaves headroom for future growth.
        env:
          RUST_MIN_STACK: "16777216"
        run: >
          cargo test
          --all-targets
          --all-features
