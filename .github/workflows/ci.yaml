name: Test internal runner

on:
  push:
  workflow_dispatch:

jobs:
  test-internal-runner:
    name: Test internal connectivity
    runs-on: ["iris-cpu"]
    container:
      image: summerwind/actions-runner:latest
      options: --user 1000:1000
    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          echo "Hostname: $(hostname)"
          echo "User: $(id -un)"

      - name: Check internal DNS
        shell: bash
        run: |
          set -euo pipefail

          getent hosts argo-cd.workflows.diamond.ac.uk

      - name: Check Argo CD HTTPS connectivity
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            https://argo-cd.workflows.diamond.ac.uk/api/version

      # - name: Check Argo CD CLI
      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     argocd version --client

      - name: Check gitlab internal DNS
        shell: bash
        run: |
          set -euo pipefail

          getent hosts gitlab.diamond.ac.uk

      - name: Check gitlab HTTPS connectivity
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            -L https://gitlab.diamond.ac.uk/

      - name: Trigger graph federation pipeline
        shell: bash
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
        run: |
          set -euo pipefail

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --form "token=${GITLAB_TRIGGER_TOKEN}" \
            --form "ref=main" \
            --form "variables[PIPELINE_TASK]=graph-federation" \
            --form "variables[GITHUB_SHA]=${GITHUB_SHA}" \
            --form "variables[GITHUB_REPOSITORY]=${GITHUB_REPOSITORY}" \
            --form "variables[GITHUB_RUN_ID]=${GITHUB_RUN_ID}" \
            "https://gitlab.diamond.ac.uk/api/v4/projects/${GITLAB_PROJECT_ID}/trigger/pipeline"
