name: Test internal runner

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  test-internal-runner:
    name: Test Argo CD connectivity

    runs-on:
      group: iris
      labels:
        - self-hosted
        - linux

    container:
      image: curlimages/curl:8.16.0

    timeout-minutes: 5

    steps:
      - name: Show runner information
        shell: sh
        run: |
          set -eu

          echo "Runner name: ${RUNNER_NAME}"
          echo "Runner OS: ${RUNNER_OS}"
          echo "Runner architecture: ${RUNNER_ARCH}"
          echo "Container hostname: $(hostname)"
          id

      - name: Check internal DNS
        shell: sh
        run: |
          set -eu

          nslookup argo-cd.workflows.diamond.ac.uk ||
            getent hosts argo-cd.workflows.diamond.ac.uk

      - name: Check Argo CD HTTPS connectivity
        shell: sh
        run: |
          set -eu

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --write-out '\nHTTP status: %{http_code}\n' \
            https://argo-cd.workflows.diamond.ac.uk/api/version
