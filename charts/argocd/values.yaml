argo-cd:
  enabled: true
  configs:
    cm:
      admin.enabled: "false"
      url: https://argo-cd.workflows.diamond.ac.uk
      oidc.config: |
        name: Keycloak
        issuer: https://identity.diamond.ac.uk/realms/dls
        clientID: workflows-argocd
        clientSecret: $argocd-oauth:oidc.keycloak.clientSecret
        requestedScopes:
          - openid
          - profile
          - email
      # Fix: "panic: assignment to entry in nil map from populatePodInfo" in Argo CD 3.4.5
      # see: https://github.com/argoproj/argo-cd/issues/26529
      # TODO: Remove when upgrading to Argo CD 3.5
      # It is safe to exclude Pods as there are no Pods directly deployed by ArgoCD
      # (only indirectly via deployments, statefulsets, etc)
      resource.exclusions: |
        - apiGroups:
          - ''
          kinds:
          - Pod
    rbac:
      create: true
      policy.default: role:readonly
      scopes: "[email, profile, openid]"
      policy.csv: |
        p, role:admin, applications, *, */*, allow
        p, role:admin, clusters, *, *, allow
        p, role:admin, repositories, *, *, allow
        p, role:admin, projects, *, *, allow
        p, role:admin, exec, create, */*, allow
        p, role:admin, logs, get, */*, allow
        p, role:admin, settings, *, *, allow
        g, admin, role:admin
        g, benedikt.daurer@diamond.ac.uk, role:admin
        g, thomas.thomas@diamond.ac.uk, role:admin
        g, vigneshwar.shanmugasundar@diamond.ac.uk, role:admin
        g, david.hadley@diamond.ac.uk, role:admin
        g, james.gilbert@diamond.ac.uk, role:admin
        g, victoria.beilsten-edmands@diamond.ac.uk, role:admin
        g, hazem.nureldin@diamond.ac.uk, role:admin
        g, matthew.carre@diamond.ac.uk, role:admin

  repoServer:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8084"
  controller:
    resources:
      limits:
        cpu: 3
        memory: 6Gi
      requests:
        cpu: 2
        memory: 4Gi
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8082"
  applicationSet:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"

ingress:
  enabled: true
  host: argo-cd.workflows.diamond.ac.uk
  secretName: argo-cd-tls-cert
