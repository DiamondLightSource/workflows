configuration:
  keycloakUrl: https://identity.diamond.ac.uk
  keycloakRealm: dls
  keycloakClient: workflows-dashboard
  keycloakScope: openid profile posix-uid email
  graphUrl: https://workflows.diamond.ac.uk/api
  graphWsUrl: wss://workflows.diamond.ac.uk/api/ws
  sourceDir: /usr/share/nginx/html
  useAuthGateway: 'true'
  authGatewayLoginUrl: https://workflows.diamond.ac.uk/auth
  logoutUrl: https://workflows.diamond.ac.uk/auth/logout
image:
  registry: ghcr.io
  repository: diamondlightsource/workflows-dashboard
  tag: ''
  digest: ''
  pullPolicy: IfNotPresent
  pullSecrets: []
deployment:
  replicas: 1
  annotations: []
  podAnnotations: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  affinity: {}
  tolerations: []
service:
  create: true
  annotations: []
  type: ClusterIP
  port: 80
ingress:
  create: true
  className: nginx
  hosts:
    - host: workflows.diamond.ac.uk
      paths:
        - path: /
          pathType: Prefix
          service:
            name: dashboard
            port: 80
        - path: /api
          pathType: Prefix
          service:
            name: auth-gateway
            port: 80
        - path: /auth
          pathType: Prefix
          service:
            name: auth-gateway
            port: 80
  tls: false
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/hsts: 'true'
    nginx.ingress.kubernetes.io/hsts-max-age: '86400'
serviceAccount:
  create: true
  name: ''
  annotations: []
authGateway:
  enabled: true
  image:
    registry: ghcr.io
    repository: diamondlightsource/workflows-auth-gateway
    tag: 0.1.2
    pullPolicy: IfNotPresent
    pullSecrets: []
  graphUrl: https://workflows.diamond.ac.uk/graphql
  configuration:
    secretName: auth-gateway-config
    config:
      oidc_provider_url: https://identity.diamond.ac.uk/realms/dls
      port: 80
      postgres_database: auth_service
      postgres_hostname: workflows-postgresql-ha-pgpool
      postgres_port: 5432
      callback_url: https://workflows.diamond.ac.uk/auth/callback
      callback_default_return_to_url: https://workflows.diamond.ac.uk
      cors_allow:
        - ^https:\/\/([a-zA-Z0-9\-]+\.)*diamond\.ac\.uk\/?
        - ^https?:\/\/localhost(:\d+)?\/?
      client_id:
        name: workflows-cluster-client
        key: client-id
        namespace: workflows
      client_secret:
        name: workflows-cluster-client
        key: client-secret
        namespace: workflows
      postgres_user:
        name: postgres-auth-service-password
        key: username
        namespace: workflows
      postgres_password:
        name: postgres-auth-service-password
        key: password
        namespace: workflows
      encryption_public_key:
        name: auth-keys
        key: encryption_public_key
        namespace: workflows
