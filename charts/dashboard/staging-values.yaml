configuration:
  keycloakUrl: https://identity-test.diamond.ac.uk
  keycloakRealm: dls
  keycloakClient: workflows-ui-dev
  keycloakScope: openid profile posix-uid email
  graphUrl: https://staging.workflows.diamond.ac.uk/api
  graphWsUrl: wss://staging.workflows.diamond.ac.uk/api/ws
  sourceDir: /usr/share/nginx/html
  useAuthGateway: "true"
  authGatewayLoginUrl: https://staging.workflows.diamond.ac.uk/auth
  logoutUrl: https://staging.workflows.diamond.ac.uk/auth/logout

ingress:
  hosts:
    - host: staging.workflows.diamond.ac.uk
      paths:
        - path: /
          pathType: Prefix
          service:
            name: dashboard
            port: 80
        - path: /api
          pathType: Prefix
          service:
            name: auth-gateway
            port: 80
        - path: /auth
          pathType: Prefix
          service:
            name: auth-gateway
            port: 80
  tls: true
  secretName: dashboard-tls-cert
  host: staging.workflows.diamond.ac.uk
authGateway:
  enabled: true
  graphUrl: https://staging.workflows.diamond.ac.uk/graphql
  configuration:
    secretName: auth-gateway-config
