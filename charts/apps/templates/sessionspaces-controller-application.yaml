{{- if .Values.sessionspacesController.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sessionspaces-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  destination:
    namespace: kube-system
    server: {{ .Values.destination.server }}
  project: default
  source:
    repoURL: https://github.com/DiamondLightSource/workflows.git
    path: charts/sessionspaces-controller
    targetRevision: {{ .Values.sessionspacesController.targetRevision }}
    helm:
      valueFiles:
        - values.yaml
        {{- if .Values.sessionspacesController.extraValueFiles }}
        {{- .Values.sessionspacesController.extraValueFiles | toYaml | nindent 8 }}
        {{- end }}
      {{- if .Values.sessionspacesController.valuesObject }}
      valuesObject:
        {{ .Values.sessionspacesController.valuesObject | toYaml | nindent 8 }}
      {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
{{- end }}
