apiVersion: v1
kind: ConfigMap
metadata:
  name: jinja-templater-hooks
  namespace: {{ .Release.Namespace }}
data:
  {{- (.Files.Glob "hooks/jinja_templater.py").AsConfig | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jinja-templater
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: jinja-templater
  template:
    metadata:
      labels:
        app: jinja-templater
    spec:
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          workingDir: /sync
          args:
            - |
              pip install --no-cache-dir {{ .Values.pythonPackages | join " " }}
              python3 /hooks/jinja_templater.py
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: hooks
              mountPath: /hooks
            - name: working-dir
              mountPath: /sync
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
      volumes:
        - name: hooks
          configMap:
            name: jinja-templater-hooks
        - name: working-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jinja-templater
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: jinja-templater
  ports:
    - name: http
      port: 80
      targetPort: http
