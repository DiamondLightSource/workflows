apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: jinja-templater
spec:
  generateSelector: true
  parentResource:
    apiVersion: templating.diamond.ac.uk/v1alpha1
    resource: jinjatemplates
  childResources:
    - apiVersion: v1
      resource: secrets
      updateStrategy:
        method: InPlace
    - apiVersion: v1
      resource: configmaps
      updateStrategy:
        method: InPlace
  hooks:
    sync:
      version: v2
      webhook:
        url: http://jinja-templater.{{ .Release.Namespace }}.svc/sync
    customize:
      version: v2
      webhook:
        url: http://jinja-templater.{{ .Release.Namespace }}.svc/customize
