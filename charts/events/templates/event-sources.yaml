{{- if index .Values "argo-events" "enabled" }}
  {{- range $webhookEventSource := $.Values.eventSources.webhook }}
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: {{ $webhookEventSource.name }}
  labels:
    workflows.diamond.ac.uk/beamline: {{ $webhookEventSource.beamline }}
spec:
  service:
    ports:
      - port: {{$webhookEventSource.port }}
        targetPort: {{$webhookEventSource.port }}
  {{- if $webhookEventSource.webhook }}
  webhook:
    {{- $webhookEventSource.webhook | toYaml | nindent 6 }}
  {{- end }}
  {{- end }}

  {{- range $genericEventSource := $.Values.eventSources.generic }}
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: {{ $genericEventSource.beamline }}
  labels:
    workflows.diamond.ac.uk/beamline: {{ $genericEventSource.beamline }}
spec:
  generic:
    {{- default (printf "%s-message" $genericEventSource.beamline) $genericEventSource.eventName | nindent 4 }}:
      insecure: true
      jsonBody: true
      url: "stomp-service.events.svc:80"
      config: |
      {{- $genericEventSource.stompConfig | toYaml | nindent 8 }}
  {{- end }}
{{- end }}
