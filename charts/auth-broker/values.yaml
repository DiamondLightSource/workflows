replicas: 1

image:
  registry: ""
  repository: ghcr.io/diamondlightsource/workflows-auth-broker
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

service:
  port: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

authBrokerConfig:
  targetName: auth-broker-config
  config:
    oidc_provider_url: https://identity.diamond.ac.uk/realms/dls
    port: 8080
    graph_url: https://graph.diamond.ac.uk/

    postgres_database: auth_service
    postgres_hostname: workflows-postgresql-ha-pgpool.workflows.svc.cluster.local
    postgres_port: 5432
    postgres_pool_max_connections: 20
    postgres_pool_min_connections: 1
    postgres_pool_idle_timeout: 300
    postgres_pool_max_lifetime: 1800
    postgres_pool_connect_timeout: 10
    postgres_pool_acquire_timeout: 10
