secrets:
  cluster: pollux

backup:
  etcd:
    enabled: true
    snapshotDir: /backup/
    snapshotName: etcd-snapshot
    fileExtension: .db
  postgres:
    enabled: true
    snapshotDir: /backup/
    snapshotName: postgres-snapshot
    fileExtension: .pgdump
  bucket:
    prefix: staging

vcluster:
  controlPlane:
    backingStore:
      etcd:
        deploy:
          statefulSet:
            persistence:
              volumeClaim:
                storageClass: netapp
    coredns:
      deployment:
        replicas: 2

  experimental:
    deploy:
      vcluster:
        helm:
          - release:
              name: argocd
              namespace: argocd
            chart:
              name: argo-cd
              version: 7.7.22
              repo: https://argoproj.github.io/argo-helm
          - release:
              name: verflixt
              namespace: argocd
            # This is the `charts/verflixt` chart as a packaged base64 string.
            # You can re-create it with `helm package charts/verflixt && base64 aoa-*.tgz`.
            # This hack allows us to deploy manifests in a deterministic order, which is not possible using `manifests`.
            bundle: 
            values: |-
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: apps
                namespace: argocd
                annotations:
                  argocd.argoproj.io/sync-wave: "0"
              spec:
                destination:
                  namespace: argocd
                  server: https://kubernetes.default.svc
                project: default
                source:
                  helm:
                    valueFiles:
                      - staging-values.yaml
                  path: charts/apps
                  repoURL: https://github.com/DiamondLightSource/workflows.git
                  targetRevision: HEAD
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true
  sync:
    fromHost:
      secrets:
        mappings:
          byName:
            "/letsencrypt-argo-cd-staging-workflows-diamond-ac-uk": "argocd/argo-cd-tls-cert"
            "/letsencrypt-argo-workflows-staging-workflows-diamond-ac-uk": "workflows/workflows-tls-cert"
            "/letsencrypt-staging-workflows-diamond-ac-uk": "workflows/dashboard-tls-cert"
            "/letsencrypt-grafana-staging-workflows-diamond-ac-uk": "monitoring/grafana-tls-cert"
            "/grafana-oauth": "monitoring/grafana-oauth"
            "/monitoring-thanos-s3": "monitoring/monitoring-thanos-s3"
            "/argo-server-sso": "workflows/argo-server-sso"
            "/sessionspaces-ispyb": "kube-system/sessionspaces-ispyb"
            "/artifact-s3-secret": "graph-proxy/artifact-s3-secret"
            "/s3-artifact": "workflows/artifact-s3"
            "/postgres-passwords": "workflows/postgres-passwords"
            "/postgres-argo-workflows-password": "workflows/postgres-argo-workflows-password"
            "/graph-proxy-k6-auth": "k6/graph-proxy-k6-auth"
            "/postgres-auth-service-password": "workflows/postgres-auth-service-password"
            "/openbao-secret": "openbao/openbao-secret"
            "/auth-keys": "workflows/auth-keys"
            "/workflows-cluster-client": "workflows/workflows-cluster-client"

ingress:
  secretName: letsencrypt-kubernetes-staging-workflows-diamond-ac-uk
  host: kubernetes.staging.workflows.diamond.ac.uk

authenticationConfiguration:
  jwt:
    - issuer:
        url: https://identity-dev.diamond.ac.uk/realms/dls
        audiences:
          - workflows-cluster-staging
          - graph
        audienceMatchPolicy: MatchAny
    - issuer:
        url: https://identity-test.diamond.ac.uk/realms/dls
        audiences:
          - workflows-cluster-staging
          - graph
        audienceMatchPolicy: MatchAny
