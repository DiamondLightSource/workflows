{{- if and $.Values.api.enabled $.Values.api.service.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sessionspaces-controller.api.fullname" $ }}
  namespace: {{ .Release.Namespace }}
  {{- with $.Values.api.service.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sessionspaces-controller.api.labels" $ | nindent 4 }}
spec:
  type: {{ $.Values.api.service.type }}
  selector:
    {{- include "sessionspaces-controller.api.matchLabels" $ | nindent 4 }}
  ports:
    - name: http
      port: {{ $.Values.api.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
