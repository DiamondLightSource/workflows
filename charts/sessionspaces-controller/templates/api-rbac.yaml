{{- if and $.Values.api.enabled $.Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (include "sessionspaces-controller.api.fullname" $) $.Values.api.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  {{- with $.Values.api.serviceAccount.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sessionspaces-controller.api.labels" $ | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
---
{{- if and $.Values.api.enabled $.Values.api.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ default (include "sessionspaces-controller.api.fullname" $) $.Values.api.serviceAccount.name }}
  labels:
    {{- include "sessionspaces-controller.api.labels" $ | nindent 4 }}
rules:
  - apiGroups: [workflows.diamond.ac.uk]
    resources: [sessionspaces]
    verbs: [get, create, patch]
{{- end }}
---
{{- if and $.Values.api.enabled $.Values.api.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ default (include "sessionspaces-controller.api.fullname" $) $.Values.api.serviceAccount.name }}
  labels:
    {{- include "sessionspaces-controller.api.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ default (include "sessionspaces-controller.api.fullname" $) $.Values.api.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ default (include "sessionspaces-controller.api.fullname" $) $.Values.api.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
