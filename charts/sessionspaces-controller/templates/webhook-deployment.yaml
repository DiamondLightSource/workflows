{{- if $.Values.webhook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sessionspaces-controller.webhook.fullname" $ }}
  namespace: {{ .Release.Namespace }}
  {{- with $.Values.webhook.deployment.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sessionspaces-controller.webhook.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.webhook.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "sessionspaces-controller.webhook.matchLabels" $ | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.webhook.deployment.podAnnotations }}
      annotations:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sessionspaces-controller.webhook.matchLabels" $ | nindent 8 }}
    spec:
      imagePullSecrets: {{ include "common.images.renderPullSecrets" (dict "images" (list $.Values.webhook.image) "context" $ ) }}
      containers:
        - name: webhook
          image: {{ include "common.images.image" ( dict "imageRoot" $.Values.webhook.image "global" $.Values.global "chart" $.Chart ) }}
          imagePullPolicy: {{ $.Values.webhook.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ $.Values.webhook.logLevel }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- $.Values.webhook.deployment.resources | toYaml | nindent 12 }}
          {{- with $.Values.webhook.deployment.nodeSelector }}
          nodeSelector:
            {{- . | toYaml | nindent 8 }}
          {{- end }}
          {{- with $.Values.webhook.deployment.affinity }}
          affinity:
            {{- . | toYaml | nindent 8 }}
          {{- end }}
          {{- with $.Values.webhook.deployment.tolerations }}
          tolerations:
            {{- . | toYaml | nindent 8 }}
          {{- end }}
{{- end }}
