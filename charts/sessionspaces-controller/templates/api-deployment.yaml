{{- if $.Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sessionspaces-controller.api.fullname" $ }}
  namespace: {{ .Release.Namespace }}
  {{- with $.Values.api.deployment.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
  labels:
    {{- include "sessionspaces-controller.api.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.api.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "sessionspaces-controller.api.matchLabels" $ | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.api.deployment.podAnnotations }}
      annotations:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sessionspaces-controller.api.matchLabels" $ | nindent 8 }}
    spec:
      {{- if $.Values.api.serviceAccount.create }}
      serviceAccountName: {{ default (include "sessionspaces-controller.api.fullname" $) $.Values.api.serviceAccount.name }}
      {{- else }}
      serviceAccountName: {{ default "default" $.Values.api.serviceAccount.name }}
      {{- end }}
      imagePullSecrets: {{ include "common.images.renderPullSecrets" (dict "images" (list $.Values.api.image) "context" $ ) }}
      containers:
        - name: api
          image: {{ include "common.images.image" ( dict "imageRoot" $.Values.api.image "global" $.Values.global "chart" $.Chart ) }}
          imagePullPolicy: {{ $.Values.api.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ $.Values.api.logLevel }}
            - name: DATABASE_URL
              value: {{ $.Values.api.databaseUrl }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.api.databasePasswordSecret.name }}
                  key: {{ $.Values.api.databasePasswordSecret.key }}
            - name: LDAP_URL
              value: {{ $.Values.api.ldapUrl }}
            - name: SESSIONSPACES_API_BIND
              value: 0.0.0.0:8081
            {{- with $.Values.api.opa.url }}
            - name: OPA_URL
              value: {{ . }}
            {{- end }}
            - name: OPA_TIMEOUT_SECS
              value: {{ $.Values.api.opa.timeoutSecs | quote }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- $.Values.api.deployment.resources | toYaml | nindent 12 }}
          {{- with $.Values.api.deployment.nodeSelector }}
          nodeSelector:
            {{- . | toYaml | nindent 8 }}
          {{- end }}
          {{- with $.Values.api.deployment.affinity }}
          affinity:
            {{- . | toYaml | nindent 8 }}
          {{- end }}
          {{- with $.Values.api.deployment.tolerations }}
          tolerations:
            {{- . | toYaml | nindent 8 }}
          {{- end }}
{{- end }}
