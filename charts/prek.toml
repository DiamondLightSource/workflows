[[repos]]
repo = "local"
hooks = [
  {
    id = "prettier",
    name = "prettier (charts yaml)",
    language = "node",
    entry = "prettier --write",
    files = "^[^/]+/[^/]*\\.ya?ml$",
    pass_filenames = true,
    additional_dependencies = ["prettier@3.6.2"],
  },
  {
    id = "prettier-json",
    name = "prettier (json)",
    language = "node",
    entry = "prettier --write",
    files = "\\.json$",
    pass_filenames = true,
    additional_dependencies = ["prettier@3.6.2"],
  },
]
