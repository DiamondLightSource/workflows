[[repos]]
repo = "local"
hooks = [
  {
    id = "prettier",
    name = "prettier (charts yaml)",
    language = "system",
    entry = "npx --yes prettier@3.6.2 --write",
    files = "^[^/]+/[^/]*\\.ya?ml$",
    pass_filenames = true,
  },
  {
    id = "prettier-json",
    name = "prettier (json)",
    language = "system",
    entry = "npx --yes prettier@3.6.2 --write",
    files = "\\.json$",
    pass_filenames = true,
  },
]
