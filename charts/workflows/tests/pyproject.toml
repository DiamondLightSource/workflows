[project]
name = "compose-secrets-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0",
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
