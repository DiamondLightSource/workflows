{{- if .Values.composeSecrets.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: compose-secrets-hooks
  namespace: {{ .Release.Namespace }}
data:
  {{- (.Files.Glob "hooks/compose-secrets.py").AsConfig | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compose-secrets
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compose-secrets
  template:
    metadata:
      labels:
        app: compose-secrets
    spec:
      containers:
      - name: controller
        image: python:3.14-slim
        command: ["/bin/sh", "-c"]
        workingDir: /sync
        args:
          - |
            pip install pyyaml
            python3 /hooks/compose-secrets.py
        volumeMounts:
        - name: hooks
          mountPath: /hooks
        - name: working-dir
          mountPath: /sync
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
      volumes:
      - name: hooks
        configMap:
          name: compose-secrets-hooks
      - name: working-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: compose-secrets
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: compose-secrets
  ports:
  - port: 80
{{- end }}
