{{- if .Values.composeSecrets.enabled }}
apiVersion: metacontroller.k8s.io/v1alpha1
kind: CompositeController
metadata:
  name: compose-secrets
spec:
  generateSelector: true
  parentResource:
    apiVersion: v1
    resource: namespaces
    labelSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
  childResources:
    - apiVersion: v1
      resource: secrets
      updateStrategy:
        method: InPlace
  hooks:
    sync:
      version: v2
      webhook:
        url: http://compose-secrets.{{ .Release.Namespace }}/sync
    customize:
      version: v2
      webhook:
        url: http://compose-secrets.{{ .Release.Namespace }}/customize
{{- end }}
