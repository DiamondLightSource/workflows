apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-mutate-workloadpriority
spec:
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-workloadpriority \
                --show-only templates/cel-mutate-workloadpriority.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-workloadpriority \
                --show-only templates/cel-mutate-workloadpriority.yaml \
                --delete
    - name: default-medium
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: medium
    - name: unrelated-annotation-is-ignored
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: unrelated-annotation
                annotations:
                  example.com/unrelated: value
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: unrelated-annotation
                annotations:
                  example.com/unrelated: value
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: medium
    - name: live-high
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: live
                annotations:
                  workflows.diamond.ac.uk/type: "live"
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: live
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: high
    - name: test-low
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: test
                annotations:
                  workflows.diamond.ac.uk/type: "test"
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: test
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: low
    - name: standard-medium
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard-type
                annotations:
                  workflows.diamond.ac.uk/type: "standard"
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard-type
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: medium
    - name: existing-labels-are-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: existing-labels
                annotations:
                  workflows.diamond.ac.uk/type: "live"
              spec:
                podMetadata:
                  labels:
                    example.com/unrelated: value
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: existing-labels
              spec:
                podMetadata:
                  labels:
                    example.com/unrelated: value
                    kueue.x-k8s.io/priority-class: high
    - name: explicit-is-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit
                annotations:
                  workflows.diamond.ac.uk/type: "live"
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: high
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: high
