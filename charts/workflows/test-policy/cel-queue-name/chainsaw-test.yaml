apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-queue-name
spec:
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-queue-name \
                --show-only templates/cel-queuename.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-queue-name \
                --show-only templates/cel-queuename.yaml \
                --delete
    - name: workflows
      try:
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: custom-queue
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: custom-queue
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit-default
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: default-queue
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit-default
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: default-queue
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: no-pod-metadata
              spec: {}
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: empty-pod-metadata
              spec:
                podMetadata: {}
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: pod-metadata-without-labels
              spec:
                podMetadata:
                  annotations:
                    example.com/key: value
    - name: mpijobs
      try:
        - error:
            resource:
              apiVersion: kubeflow.org/v2beta1
              kind: MPIJob
              metadata:
                name: mpijob-missing-queue
              spec:
                mpiReplicaSpecs:
                  Launcher:
                    replicas: 1
                    template:
                      spec:
                        containers:
                          - name: launcher
                            image: docker.io/library/busybox:latest
        - apply:
            resource:
              apiVersion: kubeflow.org/v2beta1
              kind: MPIJob
              metadata:
                name: mpijob-default-queue
                labels:
                  kueue.x-k8s.io/queue-name: default-queue
              spec:
                mpiReplicaSpecs:
                  Launcher:
                    replicas: 1
                    template:
                      spec:
                        containers:
                          - name: launcher
                            image: docker.io/library/busybox:latest
        - error:
            resource:
              apiVersion: kubeflow.org/v2beta1
              kind: MPIJob
              metadata:
                name: mpijob-custom-queue
                labels:
                  kueue.x-k8s.io/queue-name: custom-queue
              spec:
                mpiReplicaSpecs:
                  Launcher:
                    replicas: 1
                    template:
                      spec:
                        containers:
                          - name: launcher
                            image: docker.io/library/busybox:latest
