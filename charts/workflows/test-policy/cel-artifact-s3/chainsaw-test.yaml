apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-artifact-s3
spec:
  namespaceTemplate:
    metadata:
      labels:
        app.kubernetes.io/managed-by: sessionspaces
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-artifact-s3 \
                --show-only templates/cel-artifact-s3.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-artifact-s3 \
                --show-only templates/cel-artifact-s3.yaml \
                --delete
    - name: allowed-workflow-sidecars
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: allowed
              spec:
                initContainers:
                  - name: init
                    image: quay.io/argoproj/argoexec:v3.5.6
                    volumeMounts:
                      - name: artifact-s3
                        mountPath: /argo/secret/artifact-s3
                containers:
                  - name: main
                    image: docker.io/library/busybox:latest
                  - name: wait
                    image: quay.io/argoproj/argoexec:v3.5.6
                    volumeMounts:
                      - name: artifact-s3
                        mountPath: /argo/secret/artifact-s3
                  - name: argoexec-env
                    image: quay.io/argoproj/argoexec:v3.5.6
                    env:
                      - name: FOO
                        valueFrom:
                          secretKeyRef:
                            name: artifact-s3
                            key: access-key
                volumes:
                  - name: artifact-s3
                    secret:
                      secretName: artifact-s3
    - name: denied-usage
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: denied-volume-mount
              spec:
                containers:
                  - name: denied-mount
                    image: docker.io/library/busybox:latest
                    volumeMounts:
                      - name: artifact-s3
                        mountPath: /argo/secret/artifact-s3
                volumes:
                  - name: artifact-s3
                    secret:
                      secretName: artifact-s3
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: denied-secret-volume
              spec:
                containers:
                  - name: denied-volume
                    image: docker.io/library/busybox:latest
                volumes:
                  - name: renamed
                    secret:
                      secretName: artifact-s3
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: denied-container-environment
              spec:
                containers:
                  - name: denied-environment
                    image: docker.io/library/busybox:latest
                    env:
                      - name: FOO
                        valueFrom:
                          secretKeyRef:
                            name: artifact-s3
                            key: access-key
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: denied-init-container-environment
              spec:
                initContainers:
                  - name: denied-environment
                    image: docker.io/library/busybox:latest
                    env:
                      - name: FOO
                        valueFrom:
                          secretKeyRef:
                            name: artifact-s3
                            key: access-key
                containers:
                  - name: main
                    image: docker.io/library/busybox:latest
