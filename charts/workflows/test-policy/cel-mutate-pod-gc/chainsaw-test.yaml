apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-mutate-pod-gc
spec:
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-pod-gc \
                --show-only templates/cel-mutate-pod-gc.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-pod-gc \
                --show-only templates/cel-mutate-pod-gc.yaml \
                --delete
    - name: pod-gc-defaulted
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard
              spec:
                podGC:
                  strategy: OnPodCompletion
                  deleteDelayDuration: 60s
    - name: partial-delete-delay-is-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: partial-delete-delay
              spec:
                podGC:
                  deleteDelayDuration: 10s
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: partial-delete-delay
              spec:
                podGC:
                  strategy: OnPodCompletion
                  deleteDelayDuration: 10s
    - name: partial-strategy-is-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: partial-strategy
              spec:
                podGC:
                  strategy: OnWorkflowSuccess
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: partial-strategy
              spec:
                podGC:
                  strategy: OnWorkflowSuccess
                  deleteDelayDuration: 60s
    - name: explicit-pod-gc-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit
              spec:
                podGC:
                  strategy: OnWorkflowCompletion
                  deleteDelayDuration: 5m
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit
              spec:
                podGC:
                  strategy: OnWorkflowCompletion
                  deleteDelayDuration: 5m
