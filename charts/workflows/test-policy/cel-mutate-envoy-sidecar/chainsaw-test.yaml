apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-mutate-envoy-sidecar
spec:
  timeouts:
    cleanup: 120s
    delete: 60s
    assert: 60s
  steps:
    - name: deploy-mutating-policy
      try:
        - apply:
            file: mutating-policy.yaml
        - apply:
            file: mutating-policy-binding.yaml
        - sleep:
            duration: 3s
    - name: authenticated-workflow-pod-is-injected
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: injected
                labels:
                  workflows.argoproj.io/workflow: "wf-1"
                annotations:
                  workflows.diamond.ac.uk/authenticated: "true"
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    image: nginx
                    env:
                      - name: EXISTING
                        value: keep
        - script:
            content: |
              set -eu
              python3 - <<'PY'
              import json, subprocess, os
              pod = json.loads(subprocess.check_output([
                  "kubectl", "-n", os.environ["NAMESPACE"], "get", "pod", "injected", "-o", "json"]))
              spec = pod["spec"]
              ics = [c["name"] for c in spec.get("initContainers", [])]
              vols = [v["name"] for v in spec.get("volumes", [])]
              main = [c for c in spec["containers"] if c["name"] == "main"][0]
              envs = {e["name"]: e["value"] for e in main.get("env", [])}
              assert "workflows-auth-init" in ics, ics
              assert "workflows-auth-envoy-validate" in ics, ics
              assert "workflows-auth-envoy" in ics, ics
              assert "workflows-envoy-config" in vols, vols
              assert "workflows-auth-broker-token" in vols, vols
              assert envs.get("EXISTING") == "keep", envs
              assert envs.get("GRAPH_URL") == "http://127.0.0.1:6000/graphql", envs
              assert envs.get("GRAPH_URL_WS") == "http://127.0.0.1:6000/graphql/ws", envs
              print("envoy injection verified")
              PY
    - name: unauthenticated-pod-not-injected
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: not-injected
                labels:
                  workflows.argoproj.io/workflow: "wf-1"
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    image: nginx
        - script:
            content: |
              set -eu
              python3 - <<'PY'
              import json, subprocess, os
              pod = json.loads(subprocess.check_output([
                  "kubectl", "-n", os.environ["NAMESPACE"], "get", "pod", "not-injected", "-o", "json"]))
              spec = pod["spec"]
              ics = [c["name"] for c in spec.get("initContainers", [])]
              vols = [v["name"] for v in spec.get("volumes", [])]
              assert "workflows-auth-init" not in ics, ics
              assert "workflows-envoy-config" not in vols, vols
              print("unauthenticated pod not injected")
              PY
