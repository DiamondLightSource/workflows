apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-auth-broker
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import base64
    import json

    def _get_audiences(token: str) -> list[str]:
        if not token:
            return []

        try:
            parts = token.split(".")
            if len(parts) < 2:
                return []
            payload = parts[1]
            payload += "=" * (-len(payload) % 4)
            decoded = base64.urlsafe_b64decode(payload.encode("utf-8"))
            claims = json.loads(decoded.decode("utf-8"))
            aud = claims.get("aud", [])
            if isinstance(aud, str):
                return [aud]
            if isinstance(aud, list):
                return aud
            return []
        except Exception as e:
            print(f"TOKEN_AUDIENCE_DECODE_ERROR {e}", flush=True)
            return []

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            token = self.headers.get("k8s-pod-service-account-token")
            token_present = bool(token)
            print(f"TOKEN_PRESENT {str(token_present).lower()}", flush=True)
            print(f"TOKEN_AUDIENCES {_get_audiences(token)}", flush=True)

            if token_present:
                self.send_response(200)
                self.send_header("authorization", "Bearer fake-auth-broker-token")
                self.end_headers()
                self.wfile.write(b"ok")
            else:
                self.send_response(403)
                self.end_headers()
                self.wfile.write(b"missing or invalid token")

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-auth-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-auth-broker
  template:
    metadata:
      labels:
        app: fake-auth-broker
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: fake-auth-broker
          image: python:3.14-alpine
          command:
            - python
            - /app/server.py
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: fake-auth-broker
---
apiVersion: v1
kind: Service
metadata:
  name: fake-auth-broker
spec:
  selector:
    app: fake-auth-broker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
