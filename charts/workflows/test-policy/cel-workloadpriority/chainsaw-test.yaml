apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-workloadpriority
spec:
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-workloadpriority \
                --show-only templates/cel-workloadpriority.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-workloadpriority \
                --show-only templates/cel-workloadpriority.yaml \
                --delete
    - name: workflow-type-validation
      try:
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: invalid-type
                annotations:
                  workflows.diamond.ac.uk/type: processing
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: medium
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: valid-type
                annotations:
                  workflows.diamond.ac.uk/type: live
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: high
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard-type
                annotations:
                  workflows.diamond.ac.uk/type: standard
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: medium
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: unrelated-annotation
                annotations:
                  example.com/unrelated: value
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: medium
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: empty-type
                annotations:
                  workflows.diamond.ac.uk/type: ""
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: medium
    - name: kueue-label-consistency
      try:
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: live-with-low-priority
                annotations:
                  workflows.diamond.ac.uk/type: live
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: low
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: test-with-high-priority
                annotations:
                  workflows.diamond.ac.uk/type: test
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: high
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: missing-priority-label
                annotations:
                  workflows.diamond.ac.uk/type: live
              spec:
                podMetadata:
                  labels:
                    example.com/unrelated: value
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: no-pod-metadata
              spec: {}
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: match
                annotations:
                  workflows.diamond.ac.uk/type: test
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/priority-class: low
