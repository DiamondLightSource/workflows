apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-mutate-queue-name
spec:
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-queue-name \
                --show-only templates/cel-mutate-queuename.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-queue-name \
                --show-only templates/cel-mutate-queuename.yaml \
                --delete
    - name: default-queue
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: standard
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: default-queue
    - name: empty-pod-metadata-is-defaulted
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: empty-pod-metadata
              spec:
                podMetadata:
                  annotations:
                    example.com/unrelated: value
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: empty-pod-metadata
              spec:
                podMetadata:
                  annotations:
                    example.com/unrelated: value
                  labels:
                    kueue.x-k8s.io/queue-name: default-queue
    - name: existing-labels-are-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: existing-labels
              spec:
                podMetadata:
                  labels:
                    example.com/unrelated: value
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: existing-labels
              spec:
                podMetadata:
                  labels:
                    example.com/unrelated: value
                    kueue.x-k8s.io/queue-name: default-queue
    - name: explicit-queue-is-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: explicit-queue
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: explicit
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: explicit-queue
    - name: empty-queue-is-defaulted
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: empty-queue
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: ""
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: empty-queue
              spec:
                podMetadata:
                  labels:
                    kueue.x-k8s.io/queue-name: default-queue
