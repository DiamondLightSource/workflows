apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-mutate-pod-resources
spec:
  timeouts:
    cleanup: 120s
    delete: 60s
    assert: 60s
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-pod-resources \
                --show-only templates/cel-mutate-pod-resources.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-pod-resources \
                --show-only templates/cel-mutate-pod-resources.yaml \
                --delete
    - name: full-defaults
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: full-defaults
                labels:
                  kueue.x-k8s.io/managed: "true"
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    image: nginx
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: full-defaults
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    resources:
                      requests:
                        cpu: "1"
                        memory: "250Mi"
                      limits:
                        cpu: "1"
                        memory: "250Mi"
    - name: partial-requests-preserved
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: partial
                labels:
                  kueue.x-k8s.io/managed: "true"
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    image: nginx
                    resources:
                      requests:
                        cpu: "500m"
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: partial
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    resources:
                      requests:
                        cpu: "500m"
                        memory: "250Mi"
                      limits:
                        cpu: "1"
                        memory: "250Mi"
    - name: empty-resources-are-defaulted
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: empty-resources
                labels:
                  kueue.x-k8s.io/managed: "true"
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    image: nginx
                    resources: {}
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: empty-resources
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    resources:
                      requests:
                        cpu: "1"
                        memory: "250Mi"
                      limits:
                        cpu: "1"
                        memory: "250Mi"
    - name: wait-container-skipped
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: wait-skip
                labels:
                  kueue.x-k8s.io/managed: "true"
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: wait
                    image: nginx
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: wait-skip
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: wait
                    resources: {}
    - name: unmanaged-untouched
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: unmanaged
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    image: nginx
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: unmanaged
              spec:
                terminationGracePeriodSeconds: 0
                containers:
                  - name: main
                    resources: {}
    - name: more-than-ten-containers
      try:
        - script:
            content: |
              set -eu
              {
                cat <<'EOF'
              apiVersion: v1
              kind: Pod
              metadata:
                name: many-containers
                labels:
                  kueue.x-k8s.io/managed: "true"
              spec:
                terminationGracePeriodSeconds: 0
                containers:
              EOF
                i=0
                while [ "$i" -lt 12 ]; do
                  printf '  - name: c%s\n    image: busybox\n' "$i"
                  i=$((i + 1))
                done
              } | kubectl -n "$NAMESPACE" create -f -
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get pod many-containers -o json |
                jq -e '[.spec.containers[] | .resources.requests.cpu] | length == 12 and all(. == "1")'
