apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cel-mutate-posix-uid
spec:
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-posix-uid \
                --show-only templates/cel-mutate-posix-uid.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart workflows \
                --release cel-mutate-posix-uid \
                --show-only templates/cel-mutate-posix-uid.yaml \
                --delete
    - name: triggeruid-copied
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: with-trigger
                labels:
                  workflows.diamond.ac.uk/triggeruid: "12345"
              spec: {}
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get workflow with-trigger -o json |
                jq -e '.metadata.labels["workflows.diamond.ac.uk/creator-posix-uid"] == "12345"'
    - name: existing-labels-are-preserved
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: with-labels
                labels:
                  example.com/unrelated: value
                  workflows.diamond.ac.uk/triggeruid: "12345"
              spec: {}
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get workflow with-labels -o json |
                jq -e '.metadata.labels["example.com/unrelated"] == "value" and
                       .metadata.labels["workflows.diamond.ac.uk/creator-posix-uid"] == "12345"'
    - name: no-uid-does-not-label
      try:
        - apply:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: no-uid
              spec: {}
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get workflow no-uid -o json |
                jq -e '.metadata.labels["workflows.diamond.ac.uk/creator-posix-uid"] == null'
    - name: posixuid-extra-wins
      try:
        - create:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: workflow-creator
                namespace: ($namespace)
              rules:
                - apiGroups: ["argoproj.io"]
                  resources: ["workflows"]
                  verbs: ["create"]
        - create:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: workflow-creator
                namespace: ($namespace)
              subjects:
                - kind: User
                  name: oidc:test-user
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: workflow-creator
        - command:
            env:
              - name: namespace
                value: ($namespace)
            entrypoint: sh
            args:
              - -c
              - |
                cat <<'EOF' | kubectl create --namespace="$namespace" --as=oidc:test-user --as-user-extra=workflows.diamond.ac.uk/posixuid=98765 -f -
                apiVersion: argoproj.io/v1alpha1
                kind: Workflow
                metadata:
                  name: with-extra
                  labels:
                    workflows.diamond.ac.uk/triggeruid: "12345"
                spec: {}
                EOF
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get workflow with-extra -o json |
                jq -e '.metadata.labels["workflows.diamond.ac.uk/creator-posix-uid"] == "98765"'
