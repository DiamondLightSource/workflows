apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pod-security-context
spec:
  namespaceTemplate:
    metadata:
      labels:
        app.kubernetes.io/managed-by: sessionspaces
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart identity-mapper \
                --release identity-mapper \
                --show-only templates/cel-mutate-pod-security-context.yaml
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart identity-mapper \
                --release identity-mapper \
                --show-only templates/cel-mutate-pod-security-context.yaml \
                --delete
    - name: harden-managed-pod
      try:
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-pod
                namespace: ($namespace)
              spec:
                containers:
                  - name: test-container
                    image: docker.io/library/busybox:latest
                initContainers:
                  - name: test-init-container
                    image: docker.io/library/busybox:latest
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-pod
                namespace: ($namespace)
              spec:
                containers:
                  - name: test-container
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                initContainers:
                  - name: test-init-container
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
    - name: existing-container-security-context-is-merged
      try:
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: existing-container-security-context
                namespace: ($namespace)
              spec:
                containers:
                  - name: test-container
                    image: docker.io/library/busybox:latest
                    securityContext:
                      runAsNonRoot: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: existing-container-security-context
                namespace: ($namespace)
              spec:
                containers:
                  - name: test-container
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
    - name: pod-security-context-is-propagated
      try:
        - create:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: propagated
                namespace: ($namespace)
              spec:
                securityContext:
                  runAsUser: 12345
                  runAsGroup: 54321
                containers:
                  - name: plain
                    image: docker.io/library/busybox:latest
                  - name: hardened
                    image: docker.io/library/busybox:latest
                    securityContext:
                      runAsNonRoot: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: propagated
                namespace: ($namespace)
              spec:
                containers:
                  - name: plain
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsUser: 12345
                      runAsGroup: 54321
                  - name: hardened
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsUser: 12345
                      runAsGroup: 54321
    - name: more-than-ten-containers
      try:
        - script:
            content: |
              set -eu
              {
                cat <<'EOF'
              apiVersion: v1
              kind: Pod
              metadata:
                name: many-containers
              spec:
                containers:
              EOF
                i=0
                while [ "$i" -lt 12 ]; do
                  printf '  - name: c%s\n    image: busybox\n' "$i"
                  i=$((i + 1))
                done
              } | kubectl -n "$NAMESPACE" create -f -
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get pod many-containers -o json |
                jq -e '[.spec.containers[] | .securityContext.readOnlyRootFilesystem] | length == 12 and all(. == true)'
