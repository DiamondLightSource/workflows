apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mutate-argo-workflow-security-context
spec:
  namespaceTemplate:
    metadata:
      labels:
        app.kubernetes.io/managed-by: sessionspaces
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart identity-mapper \
                --release identity-mapper \
                --show-only templates/cel-mutate-workflow-security-context.yaml
        - apply:
            resource:
              apiVersion: workflows.internal.diamond.ac.uk/v1
              kind: UserIdentityMap
              metadata:
                name: user-identity-map
              spec:
                users:
                  "12":
                    uid: 12
                    gid: 34
                    supplementalGroups:
                      - 56
                      - 78
        - create:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: workflow-creator
                namespace: ($namespace)
              rules:
                - apiGroups: ["argoproj.io"]
                  resources: ["workflows"]
                  verbs: ["create"]
        - create:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: workflow-creator
                namespace: ($namespace)
              subjects:
                - kind: User
                  name: oidc:test-user
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: workflow-creator
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart identity-mapper \
                --release identity-mapper \
                --show-only templates/cel-mutate-workflow-security-context.yaml \
                --delete
              kubectl delete useridentitymap user-identity-map --ignore-not-found
    - name: mutate-from-posix-uid
      try:
        - command:
            env:
              - name: namespace
                value: ($namespace)
            entrypoint: sh
            args:
              - -c
              - |
                cat <<'EOF' | kubectl create --namespace="$namespace" --as=oidc:test-user --as-user-extra=workflows.diamond.ac.uk/posixuid=12 -f -
                apiVersion: argoproj.io/v1alpha1
                kind: Workflow
                metadata:
                  name: test-workflow
                spec: {}
                EOF
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: test-workflow
              spec:
                securityContext:
                  runAsUser: 12
                  runAsGroup: 34
                  supplementalGroups: [56, 78]
    - name: existing-security-context-is-merged
      try:
        - command:
            env:
              - name: namespace
                value: ($namespace)
            entrypoint: sh
            args:
              - -c
              - |
                cat <<'EOF' | kubectl create --namespace="$namespace" --as=oidc:test-user --as-user-extra=workflows.diamond.ac.uk/posixuid=12 -f -
                apiVersion: argoproj.io/v1alpha1
                kind: Workflow
                metadata:
                  name: existing-security-context
                spec:
                  securityContext:
                    runAsNonRoot: true
                EOF
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: existing-security-context
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 12
                  runAsGroup: 34
                  supplementalGroups: [56, 78]
    - name: unknown-posix-uid-is-ignored
      try:
        - command:
            env:
              - name: namespace
                value: ($namespace)
            entrypoint: sh
            args:
              - -c
              - |
                cat <<'EOF' | kubectl create --namespace="$namespace" --as=oidc:test-user --as-user-extra=workflows.diamond.ac.uk/posixuid=999 -f -
                apiVersion: argoproj.io/v1alpha1
                kind: Workflow
                metadata:
                  name: unknown-uid
                spec: {}
                EOF
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get workflow unknown-uid -o json |
                jq -e '.spec.securityContext == null'
    - name: missing-posix-uid-is-ignored
      try:
        - command:
            env:
              - name: namespace
                value: ($namespace)
            entrypoint: sh
            args:
              - -c
              - |
                cat <<'EOF' | kubectl create --namespace="$namespace" --as=oidc:test-user -f -
                apiVersion: argoproj.io/v1alpha1
                kind: Workflow
                metadata:
                  name: no-uid
                spec: {}
                EOF
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get workflow no-uid -o json |
                jq -e '.spec.securityContext == null'
