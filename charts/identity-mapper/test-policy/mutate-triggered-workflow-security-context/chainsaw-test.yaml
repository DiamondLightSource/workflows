apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mutate-triggered-workflow-security-context
spec:
  namespaceTemplate:
    metadata:
      labels:
        app.kubernetes.io/managed-by: sessionspaces
  steps:
    - name: deploy-policies
      try:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart identity-mapper \
                --release identity-mapper \
                --show-only templates/cel-mutate-workflow-security-context.yaml
        - apply:
            resource:
              apiVersion: workflows.internal.diamond.ac.uk/v1
              kind: UserIdentityMap
              metadata:
                name: user-identity-map
              spec:
                users:
                  "54321":
                    uid: 54321
                    gid: 54321
                    supplementalGroups: []
        - sleep:
            duration: 3s
      cleanup:
        - script:
            content: |
              set -eu
              "$(git rev-parse --show-toplevel)/.github/scripts/render-cel-policies.sh" \
                --chart identity-mapper \
                --release identity-mapper \
                --show-only templates/cel-mutate-workflow-security-context.yaml \
                --delete
              kubectl delete useridentitymap user-identity-map --ignore-not-found
    - name: mutate-from-trigger-uid
      try:
        - create:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: test-workflow
                namespace: ($namespace)
                labels:
                  workflows.diamond.ac.uk/triggeruid: "54321"
              spec: {}
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: test-workflow
                namespace: ($namespace)
              spec:
                securityContext:
                  runAsUser: 54321
                  runAsGroup: 54321
                  supplementalGroups: []
    - name: existing-security-context-and-labels-are-preserved
      try:
        - create:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: existing-security-context
                namespace: ($namespace)
                labels:
                  example.com/unrelated: value
                  workflows.diamond.ac.uk/triggeruid: "54321"
              spec:
                securityContext:
                  runAsNonRoot: true
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: existing-security-context
                namespace: ($namespace)
                labels:
                  example.com/unrelated: value
                  workflows.diamond.ac.uk/triggeruid: "54321"
              spec:
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 54321
                  runAsGroup: 54321
    - name: unknown-trigger-uid-is-ignored
      try:
        - create:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: unknown-trigger
                namespace: ($namespace)
                labels:
                  workflows.diamond.ac.uk/triggeruid: "11111"
              spec: {}
        - script:
            content: |
              set -eu
              kubectl -n "$NAMESPACE" get workflow unknown-trigger -o json |
                jq -e '.spec.securityContext == null'
