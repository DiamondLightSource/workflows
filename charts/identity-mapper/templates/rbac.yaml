apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identity-mapper:manage-identities
rules:
  - apiGroups:
      - "workflows.internal.diamond.ac.uk"
    resources:
      - useridentities
      - useridentitymaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: identity-mapper:manage-identities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: identity-mapper:manage-identities
subjects:
  - kind: ServiceAccount
    name: identity-mapper
    namespace: identity-mapper
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-mapper
  namespace: identity-mapper
