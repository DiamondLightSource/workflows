{{- if .Values.policy.enable }}
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: {{ include "common.names.fullname" $ }}-pod-security-context
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.containers) ?
            lists.range(size(object.spec.containers))
              .map(i,
                (!has(object.spec.containers[i].securityContext) ?
                  [JSONPatch{op: 'add', path: '/spec/containers/' + string(i) + '/securityContext', value: {
                    'allowPrivilegeEscalation': false,
                    'readOnlyRootFilesystem': true
                  }}] :
                  [JSONPatch{op: 'add', path: '/spec/containers/' + string(i) + '/securityContext/allowPrivilegeEscalation', value: false},
                   JSONPatch{op: 'add', path: '/spec/containers/' + string(i) + '/securityContext/readOnlyRootFilesystem', value: true}])
              ).flatten() : []) +
          (has(object.spec.initContainers) ?
            lists.range(size(object.spec.initContainers))
              .map(i,
                (!has(object.spec.initContainers[i].securityContext) ?
                  [JSONPatch{op: 'add', path: '/spec/initContainers/' + string(i) + '/securityContext', value: {
                    'allowPrivilegeEscalation': false,
                    'readOnlyRootFilesystem': true
                  }}] :
                  [JSONPatch{op: 'add', path: '/spec/initContainers/' + string(i) + '/securityContext/allowPrivilegeEscalation', value: false},
                   JSONPatch{op: 'add', path: '/spec/initContainers/' + string(i) + '/securityContext/readOnlyRootFilesystem', value: true}])
              ).flatten() : []) +
          (has(object.spec.ephemeralContainers) ?
            lists.range(size(object.spec.ephemeralContainers))
              .map(i,
                (!has(object.spec.ephemeralContainers[i].securityContext) ?
                  [JSONPatch{op: 'add', path: '/spec/ephemeralContainers/' + string(i) + '/securityContext', value: {
                    'allowPrivilegeEscalation': false,
                    'readOnlyRootFilesystem': true
                  }}] :
                  [JSONPatch{op: 'add', path: '/spec/ephemeralContainers/' + string(i) + '/securityContext/allowPrivilegeEscalation', value: false},
                   JSONPatch{op: 'add', path: '/spec/ephemeralContainers/' + string(i) + '/securityContext/readOnlyRootFilesystem', value: true}])
              ).flatten() : []) + []
    # Propagate the Pod securityContext's runAsUser/runAsGroup into every
    # container, matching the previous Kyverno rule. This runs after the
    # mutation above, so securityContext normally already exists; the fallback
    # keeps the result correct if the order ever changes.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.securityContext) &&
           has(object.spec.securityContext.runAsUser) &&
           has(object.spec.securityContext.runAsGroup)) ?
          (
            (has(object.spec.containers) ?
              lists.range(size(object.spec.containers))
                .map(i,
                  (has(object.spec.containers[i].securityContext) ?
                    [JSONPatch{op: 'add', path: '/spec/containers/' + string(i) + '/securityContext/runAsUser', value: object.spec.securityContext.runAsUser},
                     JSONPatch{op: 'add', path: '/spec/containers/' + string(i) + '/securityContext/runAsGroup', value: object.spec.securityContext.runAsGroup}] :
                    [JSONPatch{op: 'add', path: '/spec/containers/' + string(i) + '/securityContext', value: dyn({
                      'allowPrivilegeEscalation': dyn(false),
                      'readOnlyRootFilesystem': dyn(true),
                      'runAsUser': dyn(object.spec.securityContext.runAsUser),
                      'runAsGroup': dyn(object.spec.securityContext.runAsGroup)
                    })}])
                ).flatten() : []) +
            (has(object.spec.initContainers) ?
              lists.range(size(object.spec.initContainers))
                .map(i,
                  (has(object.spec.initContainers[i].securityContext) ?
                    [JSONPatch{op: 'add', path: '/spec/initContainers/' + string(i) + '/securityContext/runAsUser', value: object.spec.securityContext.runAsUser},
                     JSONPatch{op: 'add', path: '/spec/initContainers/' + string(i) + '/securityContext/runAsGroup', value: object.spec.securityContext.runAsGroup}] :
                    [JSONPatch{op: 'add', path: '/spec/initContainers/' + string(i) + '/securityContext', value: dyn({
                      'allowPrivilegeEscalation': dyn(false),
                      'readOnlyRootFilesystem': dyn(true),
                      'runAsUser': dyn(object.spec.securityContext.runAsUser),
                      'runAsGroup': dyn(object.spec.securityContext.runAsGroup)
                    })}])
                ).flatten() : []) +
            (has(object.spec.ephemeralContainers) ?
              lists.range(size(object.spec.ephemeralContainers))
                .map(i,
                  (has(object.spec.ephemeralContainers[i].securityContext) ?
                    [JSONPatch{op: 'add', path: '/spec/ephemeralContainers/' + string(i) + '/securityContext/runAsUser', value: object.spec.securityContext.runAsUser},
                     JSONPatch{op: 'add', path: '/spec/ephemeralContainers/' + string(i) + '/securityContext/runAsGroup', value: object.spec.securityContext.runAsGroup}] :
                    [JSONPatch{op: 'add', path: '/spec/ephemeralContainers/' + string(i) + '/securityContext', value: dyn({
                      'allowPrivilegeEscalation': dyn(false),
                      'readOnlyRootFilesystem': dyn(true),
                      'runAsUser': dyn(object.spec.securityContext.runAsUser),
                      'runAsGroup': dyn(object.spec.securityContext.runAsGroup)
                    })}])
                ).flatten() : []) + []
          ) : []
  reinvocationPolicy: IfNeeded
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: {{ include "common.names.fullname" $ }}-pod-security-context
spec:
  policyName: {{ include "common.names.fullname" $ }}-pod-security-context
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/managed-by: sessionspaces
{{- end }}
