image:
  registry: ghcr.io
  repository: diamondlightsource/workflows-identity-mapper
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

policy:
  # Native admission policies (MutatingAdmissionPolicy) that set podSecurityContext
  # following post 2026-05 cloud team policies:
  #  - cel-mutate-workflow-security-context: a Param-CEL policy that sets the
  #    Workflow spec.securityContext from the aggregated UserIdentityMap CRD
  #    (maintained by the identity-mapper cronjob), indexed by the caller's
  #    posix-uid (or the trigger-uid label when allowTriggerUid is true).
  #  - cel-mutate-pod-security-context: a pure-CEL policy that hardens every
  #    container securityContext in sessionspaces-managed namespaces.
  enable: true
  allowTriggerUid: true
