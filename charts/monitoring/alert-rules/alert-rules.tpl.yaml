groups:
  - name: argo-workflows
    rules:
      - alert: ArgoWorkflowControllerFailing
        expr: |
          kube_pod_container_status_waiting_reason{
            namespace="workflows",
            pod=~"workflows-argo-workflows-workflow-controller-.*",
            reason="CrashLoopBackOff"
          } > 0
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Argo Workflow Controller failing"
          description: "Workflow controller has been in CrashLoopBackOff for more than 10 minutes."
      - alert: ArgoWorkflowsPending
        expr: |
          sum(
            argo_workflows_gauge{
              phase="Pending"
            }
          ) > 5
        for: 15m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Argo Workflows are accumulating in Pending"
          description: "More than 5 Argo workflows have remained Pending continuously for 15 minutes."

      - alert: ArgoWorkflowSuccessRateLow
        expr: |
          (
            100 *
            sum(
              increase(
                argo_workflows_count_total{
                  phase="Succeeded"
                }[15m]
              )
            )
            /
            clamp_min(
              sum(
                increase(
                  argo_workflows_count_total{
                    phase=~"Succeeded|Failed|Error"
                  }[15m]
                )
              ),
              1
            )
          ) < 50
          and
          sum(
            increase(
              argo_workflows_count_total{
                phase=~"Succeeded|Failed|Error"
              }[15m]
            )
          ) >= 5
        for: 15m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Argo Workflow success rate is below 50%"
          description: "At least 5 workflows completed in the last 15 minutes and the success rate has remained below 50% for 15 minutes."

      - alert: ArgoWorkflowSuccessRateCritical
        expr: |
          (
            sum(
              increase(
                argo_workflows_count_total{
                  phase="Succeeded"
                }[15m]
              )
            ) == 0
          )
          and
          sum(
            increase(
              argo_workflows_count_total{
                phase=~"Succeeded|Failed|Error"
              }[15m]
            )
          ) >= 5
        for: 15m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Argo Workflow success rate is 0%"
          description: "At least 5 workflows completed in the last 15 minutes and none of them succeeded for 15 minutes."
  - name: k6-operator
    rules:
      - alert: ProbeNotStarted
        expr: |
          k6_workflow_succeeded{
              k8s_namespace_name="k6",
          } != 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Probe workflow did not start
          description: A probe workflow is created every hour (in ks10000-1). One has not started for 2 hours
      - alert: ProbeUnsuccessful
        expr: |
          k6_workflow_succeeded{
              k8s_namespace_name="k6",
          } == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Probe workflow did no succeed
          description: A probe workflow is created every hour (in ks10000-1). One has not succeeded for 2 hours
      - alert: K6 Probe Failure
        expr: |
          k6_synthetic_probe_failing{
              k8s_namespace_name="k6"
          } == 1
        keep_firing_for: 1h
        labels:
          severity: warning
        annotations:
          summary: Probe {{`{{ $labels.probe }}`}} failed
          description: >
              The `{{`{{ $labels.probe }}`}}` probe which started at {{`{{ $labels.k8s_pod_start_time }}`}} failed because
              {{`{{ $labels.reason }}`}}
      {{ range .Values.k6.probes }}
      - alert: K6 Probe Did Not Run
        expr: |
          absent(
            k6_synthetic_probe_failing{
              k8s_namespace_name="k6",
              probe="{{ . }}"
            }
          ) == 1
        for: 75m
        labels:
          severity: warning
        annotations:
          summary: "Probe {{ . }} is offline"
          description: "No metrics are being received from probe {{ . }}, suggesting that it is not running."
      {{ end }}

  - name: postgresql
    rules:
      - alert: PostgresBackendConnectionsHigh
        expr: |
          100 *
          sum by (namespace, pod) (
            pg_stat_activity_count{
              namespace="workflows",
              job="otel-collector",
              app_kubernetes_io_instance="workflows",
              app_kubernetes_io_component="postgresql",
              pod!=""
            }
          )
          /
          on (namespace, pod)
          max by (namespace, pod) (
            pg_settings_max_connections{
              namespace="workflows",
              job="otel-collector",
              app_kubernetes_io_instance="workflows",
              app_kubernetes_io_component="postgresql",
              pod!=""
            }
          ) > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "PostgreSQL backend connections high on {{`{{ $labels.pod }}`}}"
          description: 'Backend connection utilisation on {{`{{ $labels.pod }}`}} exceeded 80% of max_connections for 10 minutes. Current utilisation: {{`{{ printf "%.1f" $value }}`}}%.'

      - alert: PostgresBackendConnectionsCritical
        expr: |
          100 *
          sum by (namespace, pod) (
            pg_stat_activity_count{
              namespace="workflows",
              job="otel-collector",
              app_kubernetes_io_instance="workflows",
              app_kubernetes_io_component="postgresql",
              pod!=""
            }
          )
          /
          on (namespace, pod)
          max by (namespace, pod) (
            pg_settings_max_connections{
              namespace="workflows",
              job="otel-collector",
              app_kubernetes_io_instance="workflows",
              app_kubernetes_io_component="postgresql",
              pod!=""
            }
          ) > 95
        for: 10m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "PostgreSQL backend connections critical on {{`{{ $labels.pod }}`}}"
          description: 'Backend connection utilisation on {{`{{ $labels.pod }}`}} exceeded 95% of max_connections for 10 minutes. Current utilisation: {{`{{ printf "%.1f" $value }}`}}%.'

      - alert: PgpoolFrontendConnectionsHigh
        expr: |
          100 * max(
            pgpool2_frontend_used_ratio{
              namespace="workflows"
            }
          ) > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Pgpool frontend connections high"
          description: 'Frontend connection utilisation exceeded 80% for 10 minutes. Current utilisation: {{`{{ printf "%.1f" $value }}`}}%.'

      - alert: PgpoolFrontendConnectionsCritical
        expr: |
          100 * max(
            pgpool2_frontend_used_ratio{
              namespace="workflows"
            }
          ) > 95
        for: 10m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Pgpool frontend connections critical"
          description: 'Frontend connection utilisation exceeded 95% for 10 minutes. Current utilisation: {{`{{ printf "%.1f" $value }}`}}%.'

      - alert: PgpoolDown
        expr: |
          absent(
            pgpool2_frontend_used_ratio{
              namespace="workflows",
              pod=~"workflows-postgresql-ha-pgpool-.*"
            }
          )
          or
          kube_pod_status_phase{
            namespace="workflows",
            pod=~"workflows-postgresql-ha-pgpool-.*",
            phase=~"Pending|Failed|Unknown"
          } == 1
        for: 10m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Pgpool is down or not producing metrics"
          description: "Pgpool metrics are absent, or a Pgpool pod has remained Pending, Failed, or Unknown for 10 minutes."

      - alert: PostgresDown
        expr: |
          absent(
            pg_stat_activity_count{
              namespace="workflows",
              job="otel-collector",
              app_kubernetes_io_instance="workflows",
              app_kubernetes_io_component="postgresql"
            }
          )
        for: 10m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "PostgreSQL is not producing metrics"
          description: "No PostgreSQL metrics have been received for 10 minutes."
  - name: core-service-resource-saturation
    rules:

      - alert: WorkflowContainerCPUUsageHigh
        expr: |
          100 *
          sum by (namespace, pod, container) (
            rate(container_cpu_usage_seconds_total{
              namespace!~".*-[0-9]+$",
              container!="",
              container!="POD"
            }[5m])
          )
          /
          on (namespace, pod, container)
          max by (namespace, pod, container) (
            kube_pod_container_resource_limits{
              namespace!~".*-[0-9]+$",
              resource="cpu",
              unit="core"
            } > 0
          ) > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Workflow container CPU usage high on {{`{{ $labels.pod }}`}}"
          description: 'Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} is using {{`{{ printf "%.1f" $value }}`}}% of its CPU limit.'

      - alert: WorkflowContainerCPUUsageCritical
        expr: |
          100 *
          sum by (namespace, pod, container) (
            rate(container_cpu_usage_seconds_total{
              namespace!~".*-[0-9]+$",
              container!="",
              container!="POD"
            }[5m])
          )
          /
          on (namespace, pod, container)
          max by (namespace, pod, container) (
            kube_pod_container_resource_limits{
              namespace!~".*-[0-9]+$",
              resource="cpu",
              unit="core"
            } > 0
          ) > 95
        for: 5m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Workflow container CPU usage critical on {{`{{ $labels.pod }}`}}"
          description: 'Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} is using {{`{{ printf "%.1f" $value }}`}}% of its CPU limit.'
      - alert: WorkflowContainerMemoryUsageHigh
        expr: |
          100 *
          max by (namespace, pod, container) (
            container_memory_working_set_bytes{
              namespace!~".*-[0-9]+$",
              container!="",
              container!="POD"
            }
          )
          /
          on (namespace, pod, container)
          max by (namespace, pod, container) (
            kube_pod_container_resource_limits{
              namespace!~".*-[0-9]+$",
              resource="memory",
              unit="byte"
            } > 0
          ) > 80
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Workflow container memory usage high on {{`{{ $labels.pod }}`}}"
          description: 'Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} is using {{`{{ printf "%.1f" $value }}`}}% of its memory limit.'
      - alert: WorkflowContainerMemoryUsageCritical
        expr: |
          100 *
          max by (namespace, pod, container) (
            container_memory_working_set_bytes{
              namespace!~".*-[0-9]+$",
              container!="",
              container!="POD"
            }
          )
          /
          on (namespace, pod, container)
          max by (namespace, pod, container) (
            kube_pod_container_resource_limits{
              namespace!~".*-[0-9]+$",
              resource="memory",
              unit="byte"
            } > 0
          ) > 95
        for: 5m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Workflow container memory usage critical on {{`{{ $labels.pod }}`}}"
          description: 'Container {{`{{ $labels.container }}`}} in pod {{`{{ $labels.pod }}`}} is using {{`{{ printf "%.1f" $value }}`}}% of its memory limit.'

  - name: argo-workflows-latency
    rules:
      - alert: ArgoWorkflowHighRuntimeLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (namespace, name, le) (
              rate(argo_workflows_workflowtemplate_runtime_bucket[1h])
            )
          ) > 3600
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "High runtime for workflow template {{`{{ $labels.name }}`}}"
          description: 'P95 runtime for template {{`{{ $labels.name }}`}} in namespace {{`{{ $labels.namespace }}`}} has exceeded 60 for 10 minutes.'

      - alert: ArgoWorkflowHighQueueLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (namespace, queue_name, le) (
              rate(
                argo_workflows_queue_latency_bucket{
                  queue_name="workflow_queue"
                }[5m]
              )
            )
          ) > 30
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "High Argo Workflow queue latency"
          description: 'P95 queue latency for queue {{`{{ $labels.queue_name }}`}} in namespace {{`{{ $labels.namespace }}`}} has exceeded 30.'

      - alert: ArgoWorkflowHighQueueDuration
        expr: |
          histogram_quantile(
            0.95,
            sum by (namespace, queue_name, le) (
              rate(argo_workflows_queue_duration_bucket[5m])
            )
          ) > 60
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "High Argo Workflow queue duration"
          description: 'P95 queue duration for queue {{`{{ $labels.queue_name }}`}} in namespace {{`{{ $labels.namespace }}`}} has exceeded 60.'


  - name: kubernetes-pod-restarts
    rules:
      - alert: KubernetesPodRestartWarning
        expr: |
          sum by (namespace, pod, container) (
            increase(kube_pod_container_status_restarts_total[15m])
          ) >= 3
        for: 5m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Repeated restarts detected for pod {{`{{ $labels.pod }}`}}"
          description: >-
            Container {{`{{ $labels.container }}`}} in namespace
            {{`{{ $labels.namespace }}`}} has restarted at least 3 times
            in the last 15 minutes. Investigate container logs, pod events,
            and resource usage.


      - alert: KubernetesPodRestartCritical
        expr: |
          sum by (namespace, pod, container) (
            increase(kube_pod_container_status_restarts_total[15m])
          ) >= 5
        for: 5m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Persistent restarts detected for pod {{`{{ $labels.pod }}`}}"
          description: >-
            Container {{`{{ $labels.container }}`}} in namespace
            {{`{{ $labels.namespace }}`}} has restarted at least 5 times
            in the last 15 minutes. Investigate immediately for
            CrashLoopBackOff, OOMKilled, application failures, and
            resource constraints.


- name: workflow-network
  rules:
    - alert: NodeNetworkErrorsDetected
      expr: |
        sum by (instance, device) (
          rate(node_network_receive_errs_total{
            job="node-exporter",
            device!~"lo|docker0|veth.*"
          }[5m])
          +
          rate(node_network_transmit_errs_total{
            job="node-exporter",
            device!~"lo|docker0|veth.*"
          }[5m])
        ) > 0
      for: 10m
      labels:
        severity: warning
        priority: P1
      annotations:
        summary: 'Network errors on {{`{{ $labels.instance }}`}}'
        description: >-
          Network errors have persisted for 10 minutes on interface
          {{`{{ $labels.device }}`}}.
          Investigate interface counters, host network logs,
          and correlated workflow failures.

    - alert: NodeNetworkPacketDropRatioHigh
      expr: |
        (
          100 *
          sum by (instance, device) (
            rate(node_network_receive_drop_total{
              job="node-exporter",
              device!~"lo|docker0|veth.*"
            }[5m])
          )
          /
          sum by (instance, device) (
            rate(node_network_receive_packets_total{
              job="node-exporter",
              device!~"lo|docker0|veth.*"
            }[5m])
          )
        )
        and on (instance, device)
        (
          sum by (instance, device) (
            rate(node_network_receive_packets_total{
              job="node-exporter",
              device!~"lo|docker0|veth.*"
            }[5m])
          ) > 0
        ) > 1
      for: 10m
      labels:
        severity: warning
        priority: P1
      annotations:
        summary: 'Elevated receive packet drops on {{`{{ $labels.instance }}`}}'
        description: >-
          Receive packet drops exceed 1% on interface
          {{`{{ $labels.device }}`}} for 10 minutes.
          Check interface counters, traffic levels, host network logs,
          and correlated workflow failures.

    - alert: NetworkProbeFailureWarning
      expr: |
        probe_success{
          job="probe/prometheus-master/blackbox-probe"
        } == 0
      for: 2m
      labels:
        severity: warning
        priority: P2
      annotations:
        summary: 'Connectivity probe failing for {{`{{ $labels.instance }}`}}'
        description: >-
          The connectivity probe has failed for at least 2 minutes.
          Check DNS resolution, endpoint reachability, TLS, and probe logs.

    - alert: NetworkProbeFailureCritical
      expr: |
        probe_success{
          job="probe/prometheus-master/blackbox-probe"
        } == 0
      for: 10m
      labels:
        severity: critical
        priority: P1
      annotations:
        summary: 'Connectivity probe persistently failing for {{`{{ $labels.instance }}`}}'
        description: >-
          The connectivity probe has failed for at least 10 minutes.
          Investigate DNS, connectivity, endpoint availability, and TLS.
          Check the Blackbox Exporter logs and correlated service failures.

    - alert: ProbeHTTP5xxWarning
      expr: |
        probe_http_status_code{
          job="probe/prometheus-master/blackbox-probe"
        } >= 500
      for: 5m
      labels:
        severity: warning
        priority: P2
      annotations:
        summary: 'HTTP 5xx responses from {{`{{ $labels.instance }}`}}'
        description: >-
          The endpoint has returned HTTP 5xx responses for at least
          5 minutes. Investigate service health and server logs.

    - alert: ProbeHTTP5xxCritical
      expr: |
        probe_http_status_code{
          job="probe/prometheus-master/blackbox-probe"
        } >= 500
      for: 10m
      labels:
        severity: critical
        priority: P1
      annotations:
        summary: 'Persistent HTTP 5xx responses from {{`{{ $labels.instance }}`}}'
        description: >-
          The endpoint has returned HTTP 5xx responses for at least
          10 minutes. Investigate the service and its dependencies.

    - alert: ProbeDurationNearTimeout
      expr: |
        (
          probe_duration_seconds{
            job="probe/prometheus-master/blackbox-probe"
          }
          /
          probe_timeout_seconds{
            job="probe/prometheus-master/blackbox-probe"
          }
        ) > 0.8
        and on (instance, job, namespace)
        (
          probe_timeout_seconds{
            job="probe/prometheus-master/blackbox-probe"
          } > 0
        )
      for: 5m
      labels:
        severity: warning
        priority: P2
      annotations:
        summary: 'Probe approaching timeout for {{`{{ $labels.instance }}`}}'
        description: >-
          Probe duration has exceeded 80% of its configured timeout
          for 5 minutes. Investigate endpoint latency, DNS lookup time,
          and network connectivity.

    - alert: ProbeDNSLookupSlow
      expr: |
        probe_dns_lookup_time_seconds{
          job="probe/prometheus-master/blackbox-probe"
        } > 1
      for: 5m
      labels:
        severity: warning
        priority: P2
      annotations:
        summary: 'Slow DNS lookup for {{`{{ $labels.instance }}`}}'
        description: >-
          DNS lookup time has exceeded 1 second for 5 minutes.
          Investigate resolver latency and DNS service health.

  - name: prometheus-scraping
    rules:
      - alert: PrometheusScrapeFailureWarning
        expr: |
          up == 0
        for: 5m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Prometheus scrape failing for {{`{{ $labels.job }}`}}"
          description: >-
            Prometheus has failed to scrape target
            {{`{{ $labels.instance }}`}} for job
            {{`{{ $labels.job }}`}} for at least 5 minutes.
            Investigate target availability, exporter health, network connectivity,
            and scrape configuration.
          dashboard: "https://prometheus.workflows.diamond.ac.uk/targets"

      - alert: PrometheusScrapeFailureCritical
        expr: |
          up == 0
        for: 15m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Prometheus scrape failure persists for {{`{{ $labels.job }}`}}"
          description: >-
            Prometheus has failed to scrape target
            {{`{{ $labels.instance }}`}} for job
            {{`{{ $labels.job }}`}} for at least 15 minutes.
            Investigate target availability, exporter health, network connectivity,
            and scrape configuration.
          dashboard: "https://prometheus.workflows.diamond.ac.uk/targets"
