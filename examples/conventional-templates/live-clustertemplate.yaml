apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: live-clustertemplate
  labels:
    workflows.diamond.ac.uk/science-group-examples: "true"
  annotations:
    workflows.argoproj.io/title: Live cluster template
    workflows.argoproj.io/description: |
      Example live-priority workflow.
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/workflows"


spec:
  workflowMetadata:
          annotations:
                workflows.argoproj.io/description: Testing live-priority workflows
                workflows.diamond.ac.uk/type: "live"
  entrypoint: hello

  templates:
    - name: hello
      container:
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
          - |
            echo "starting"
            sleep 5
            echo "processing"
            for i in $(seq 1 60);do
              echo "processing $i"
              sleep 3
            done
            echo "finished"
